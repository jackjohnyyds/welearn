<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WeLearn · 白袍手记</title>
<style>
:root{
  --blue:#4A90D9; --assist:#E8F2FB; --ink:#1A2B3C; --ink2:#5A6B7C;
  --c1:#FF6B6B; --c2:#4ECDC4; --c3:#FFE66D; --c4:#A8E6CF; --c5:#C7B8EA;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:linear-gradient(160deg,#FFE5EC 0%,#E8F2FB 40%,#D4F0F0 100%);
  min-height:100vh;color:var(--ink);padding-bottom:80px;
}
.header{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#FF6B6B,#4A90D9,#4ECDC4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;flex:1;text-align:center}
.menu-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.menu-btn span{width:18px;height:2px;background:var(--ink);border-radius:2px}
.subtitle{text-align:center;font-size:12px;color:var(--ink2);margin-top:2px}

.tabbar{position:fixed;bottom:0;left:0;right:0;height:64px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(16px);
  display:flex;z-index:100;border-top:1px solid rgba(255,255,255,.5)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;color:var(--ink2);transition:all .2s}
.tab.active{color:var(--blue);transform:translateY(-3px)}
.tab .icon{font-size:22px}.tab .label{font-size:10px;font-weight:600}

.page{display:none;padding:12px 14px;animation:fadeIn .3s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:rgba(255,255,255,.75);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.6);border-radius:20px;
  padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.06);
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.card:active{transform:scale(.96)}
.card .badge{display:inline-block;font-size:10px;padding:3px 10px;border-radius:12px;
  font-weight:700;margin-bottom:8px}
.badge.c1{background:#FFE5E5;color:#E74C3C}
.badge.c2{background:#E0F7F5;color:#1ABC9C}
.badge.c3{background:#FFF8DC;color:#F39C12}
.badge.c4{background:#E8F8F0;color:#27AE60}
.badge.c5{background:#F0E6FF;color:#8E44AD}
.card h3{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:6px}
.card p{font-size:13px;color:var(--ink2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.loading{text-align:center;padding:40px;color:var(--ink2)}

.btn{display:inline-block;background:linear-gradient(90deg,#4A90D9,#6FA8DC);
  color:#fff;border:none;padding:10px 22px;border-radius:24px;font-size:14px;
  font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(74,144,217,.3);margin:4px}
.btn:disabled{opacity:.5}
.btn.outline{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:flex-end}
.mask.show{display:flex}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px 18px 30px;
  max-height:85vh;overflow-y:auto;width:100%;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h2{font-size:18px;font-weight:800;line-height:1.4;margin-bottom:12px}
.sheet .body{font-size:14px;line-height:1.8;color:var(--ink)}
.sheet .zh{margin-top:16px;padding:14px;background:var(--assist);border-radius:12px;font-size:14px;line-height:1.8}
.close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:#999}

.subtabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.subtab{flex:1;min-width:80px;text-align:center;padding:8px 4px;border-radius:12px;
  background:rgba(255,255,255,.6);font-size:12px;cursor:pointer;color:var(--ink2);font-weight:600}
.subtab.active{background:var(--blue);color:#fff}

.fin-card{background:rgba(255,255,255,.75);border-radius:16px;padding:14px;margin-bottom:10px;
  border-left:4px solid var(--blue)}
.fin-card .name{font-size:14px;font-weight:700}
.fin-card .meta{font-size:12px;color:var(--ink2);margin-top:4px}
.fin-card .pct{float:right;font-weight:700}
.up{color:#e74c3c}.down{color:#2ecc71}

.music-rank{display:flex;align-items:center;gap:12px;padding:12px;
  background:rgba(255,255,255,.75);border-radius:16px;margin-bottom:10px;cursor:pointer}
.rank-num{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:14px;color:#fff}
.rank-1{background:linear-gradient(135deg,#FF6B6B,#FF8E53)}
.rank-2{background:linear-gradient(135deg,#4A90D9,#6FA8DC)}
.rank-3{background:linear-gradient(135deg,#4ECDC4,#44B8A6)}
.rank-n{background:#ddd}
.music-info{flex:1;min-width:0}
.music-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-artist{font-size:12px;color:var(--ink2)}

.case-section{margin-bottom:12px}
.case-section h4{font-size:13px;color:var(--blue);margin-bottom:4px}
.case-section p{font-size:14px;line-height:1.7}
.disclaimer{text-align:center;font-size:11px;color:#aaa;padding:16px 10px;line-height:1.6}

.drawer{position:fixed;top:0;right:-280px;width:280px;height:100vh;
  background:#fff;z-index:300;transition:right .3s;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
.drawer.show{right:0}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:299;display:none}
.drawer-mask.show{display:block}
.drawer h3{padding:20px 16px 10px;font-size:16px}
.drawer-item{display:block;width:100%;padding:14px 16px;border:none;background:none;
  text-align:left;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f0f0}
</style>
</head>
<body>

<div class="header">
  <div style="width:40px"></div>
  <div><h1>WeLearn</h1><div class="subtitle">白袍手记 · 每日学习工作台</div></div>
  <div class="menu-btn" onclick="openDrawer()"><span></span><span></span><span></span></div>
</div>

<div class="drawer-mask" id="drawer-mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <h3>设置</h3>
  <button class="drawer-item" onclick="showHistory()">📖 浏览历史</button>
  <button class="drawer-item" onclick="refreshAll()">🔄 刷新内容</button>
  <div id="history-list" style="padding:0 16px;max-height:60vh;overflow-y:auto"></div>
</div>

<div class="page active" id="page-articles"><div class="loading">正在抓取外刊…</div><div id="articles-list"></div></div>
<div class="page" id="page-listening"><div class="loading">正在抓取听力…</div><div id="listening-list"></div></div>
<div class="page" id="page-music">
  <div class="subtabs">
    <div class="subtab active" data-music="netease">🎵 网易云热歌</div>
  </div>
  <div id="music-netease"></div>
</div>
<div class="page" id="page-medical"><div class="loading">正在加载病例库…</div><div id="medical-list"></div></div>
<div class="page" id="page-finance">
  <div class="subtabs">
    <div class="subtab active" data-fin="news">📊 财经资讯</div>
    <div class="subtab" data-fin="etf">📈 ETF涨幅榜</div>
    <div class="subtab" data-fin="ai">🤖 AI预测</div>
  </div>
  <div id="fin-news"><div class="loading">正在获取国内财经资讯…</div></div>
  <div id="fin-etf" style="display:none"><div class="loading">正在获取ETF涨幅…</div></div>
  <div id="fin-ai" style="display:none"><div class="loading">AI分析中…</div></div>
  <div class="disclaimer">所有内容仅供学习参考，不构成任何投资建议。</div>
</div>

<div class="tabbar">
  <div class="tab active" data-page="articles"><span class="icon">📰</span><span class="label">外刊</span></div>
  <div class="tab" data-page="listening"><span class="icon">🎧</span><span class="label">听力</span></div>
  <div class="tab" data-page="music"><span class="icon">🎵</span><span class="label">音乐</span></div>
  <div class="tab" data-page="medical"><span class="icon">🩺</span><span class="label">医学</span></div>
  <div class="tab" data-page="finance"><span class="icon">📈</span><span class="label">金融</span></div>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <button class="close" onclick="closeDetail()">×</button>
    <h2 id="d-title"></h2>
    <div class="body" id="d-body"></div>
    <div id="d-btns" style="margin-top:16px"></div>
    <div class="zh" id="d-zh" style="display:none"></div>
  </div>
</div>

<script>
const rss2json = u => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`;
const strip = s => s.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const esc = s => {const d=document.createElement('div');d.textContent=s;return d.innerHTML};

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('page-'+t.dataset.page).classList.add('active');
  };
});
document.querySelectorAll('[data-fin]').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('[data-fin]').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['news','etf','ai'].forEach(k=>document.getElementById('fin-'+k).style.display='none');
    document.getElementById('fin-'+t.dataset.fin).style.display='block';
  };
});
document.querySelectorAll('[data-music]').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('[data-music]').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['netease','qq'].forEach(k=>document.getElementById('music-'+k).style.display='none');
    document.getElementById('music-'+t.dataset.music).style.display='block';
  };
});

function addHistory(title, url){
  let h = JSON.parse(localStorage.getItem('welearn_history')||'[]');
  h.unshift({title, url});
  h = h.slice(0,30);
  localStorage.setItem('welearn_history', JSON.stringify(h));
}
function showHistory(){
  const h = JSON.parse(localStorage.getItem('welearn_history')||'[]');
  const el = document.getElementById('history-list');
  if(!h.length){el.innerHTML='<p style="color:#999;padding:10px">暂无浏览记录</p>';return}
  el.innerHTML = h.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee;font-size:13px">${esc(x.title)}</div>`).join('');
}
function openDrawer(){document.getElementById('drawer').classList.add('show');document.getElementById('drawer-mask').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('drawer-mask').classList.remove('show')}
function refreshAll(){location.reload()}

let currentText='';
async function doTranslate(){
  const btn=document.getElementById('t-btn');
  btn.disabled=true;btn.textContent='翻译中…';
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(currentText.slice(0,500))}&langpair=en|zh-CN`);
  const d=await r.json();
  document.getElementById('d-zh').textContent=d.responseData?.translatedText||'翻译失败';
  document.getElementById('d-zh').style.display='block';
  btn.disabled=false;btn.textContent='重新翻译';
}
function openDetail(title, body, sourceUrl, isEnglish){
  currentText = isEnglish ? body : '';
  document.getElementById('d-title').textContent=title;
  document.getElementById('d-body').textContent=body.slice(0,1000);
  document.getElementById('d-zh').style.display='none';
  let btns = '';
  if(isEnglish) btns += '<button class="btn" id="t-btn" onclick="doTranslate()">翻译成中文</button>';
  if(sourceUrl) btns += `<button class="btn outline" onclick="window.open('${sourceUrl}','_blank')">查看原文</button>`;
  document.getElementById('d-btns').innerHTML = btns;
  document.getElementById('mask').classList.add('show');
  addHistory(title, sourceUrl||'');
}
function closeDetail(){document.getElementById('mask').classList.remove('show')}

async function loadArticles(){
  const fallback=[
    {t:"I followed Beatrix Potter's routine (cosy day in English Countryside)",zh:'我模仿碧雅翠丝·波特的日常（英国乡村惬意一天）',cat:'文化',src:'englio·B1',link:'https://englio.ai/article/89a4209f-974a-4d66-ac21-939da26ed7a2'},
    {t:"The US-China Race to Establish Permanent Moon Bases",zh:'中美争夺建立永久月球基地',cat:'科技',src:'englio·C1',link:'https://englio.ai/article/115037cd-e9bc-4b45-a4cb-0b0538ba1db0'},
    {t:"Finding Pi in Randomness: Three Mathematical Methods",zh:'在随机性中寻找圆周率：三种数学方法',cat:'科技',src:'englio·B2',link:'https://englio.ai/article/d877842a-c35f-4a64-9b7e-4362a6a71586'},
    {t:"GPS Spoofing in the Strait of Hormuz: A Navigation Crisis",zh:'霍尔木兹海峡GPS欺骗：导航危机',cat:'科技',src:'englio·C1',link:'https://englio.ai/article/167c1fa9-78e7-4a7a-abac-28c502fcb1cc'},
    {t:"Dolphin Stranding Mystery Solved: Orcas as Culprits",zh:'海豚搁浅之谜破解：虎鲸是元凶',cat:'环境',src:'englio·B1',link:'https://englio.ai/article/8faf496e-0f73-455e-bcf1-8321b93a0656'},
    {t:"NASA Targets April 1 for Artemis II Moon Mission",zh:'NASA计划4月1日发射阿耳忒弥斯二号登月任务',cat:'科技',src:'englio·B2',link:'https://englio.ai/article/e866b236-0c4b-4829-873d-0e4c6e00f76a'},
    {t:"Mathematicians Unify Centuries of Pi Formulas Through AI-Discovered Structure",zh:'数学家通过AI发现的结构统一了百年π公式',cat:'科技',src:'englio·B2',link:'https://englio.ai/article/d8a738a0-a9a6-4a5d-986f-c05a607ae076'},
    {t:"Raccoons Solve Puzzles for Fun: Study Reveals Information Foraging",zh:'浣熊为乐趣解谜：研究揭示信息觅食行为',cat:'科技',src:'englio·B2',link:'https://englio.ai/article/2339c72d-2e5a-4d88-9a0a-e161ac56a55b'},
    {t:"The Mystery of the Runaway Black Hole",zh:'失控黑洞之谜',cat:'科技',src:'englio·C1',link:'https://englio.ai/article/fdd2728b-3bde-4ec0-a95b-098e70bbc0bb'},
    {t:"Why Friday the 13th is a Mathematical Inevitability",zh:'为什么13号星期五在数学上不可避免',cat:'科技',src:'englio·B2',link:'https://englio.ai/article/14b76704-74c0-47f1-a4f1-4c638517b1bb'},
    {t:"AI and Robots Revolutionize Biological Experimentation",zh:'AI与机器人革新生物实验',cat:'科技',src:'englio·B2',link:'https://englio.ai/article/529892cd-dad4-458d-8ceb-0023790295de'},
    {t:"Record Winter Heat in the U.S. and Climate Change Impacts",zh:'美国冬季创纪录高温与气候变化影响',cat:'环境',src:'englio·B1',link:'https://englio.ai/article/e78a1c14-87e2-4a7b-9a7f-46b9678c3c8e'},
  ];
  let englio=fallback;
  try{
    const r=await fetch('articles.json?t='+Date.now());
    const d=await r.json();
    if(d.items && d.items.length) englio=d.items.slice(0,12);
  }catch(e){}
  const feeds=[['https://feeds.npr.org/1001/rss.xml','NPR','c1']];
  const all=[];
  englio.forEach(a=>all.push({title:a.t,zh:a.zh,cat:a.cat,source:a.src,c:'c3',link:a.link,desc:''}));
  for(const [url,name,c] of feeds){
    try{const r=await fetch(rss2json(url));const d=await r.json();
      (d.items||[]).slice(0,5).forEach(i=>all.push({title:i.title,zh:'',cat:'',desc:i.description||'',source:name,c,link:i.link}));
    }catch(e){}
  }
  document.querySelector('#page-articles .loading').style.display='none';
  const list=document.getElementById('articles-list');
  all.slice(0,15).forEach(a=>{
    const div=document.createElement('div');
    div.className='card';
    const badge = a.cat ? `<span class="badge c3">${a.cat}</span>` : `<span class="badge ${a.c}">${a.source}</span>`;
    const zh = a.zh ? `<p style="color:#4A90D9;font-weight:500">${a.zh}</p>` : '';
    div.innerHTML=`${badge}<h3>${esc(a.title)}</h3>${zh}<p>${esc(strip(a.desc))}</p>`;
    div.onclick=()=>openDetail(a.title,strip(a.desc)||a.title,a.link,true);
    list.appendChild(div);
  });
}

function renderMusic(list, containerId){
  const el = document.getElementById(containerId);
  el.innerHTML='';
  list.forEach((s,i)=>{
    const rank=i+1;
    const rc=rank<=3?'rank-'+rank:'rank-n';

      addHistory(s.n,'');

}

function openChineseCase(c){
  currentText='';
  document.getElementById('d-title').textContent=c.t+'（'+c.dept+'）';
  document.getElementById('d-body').innerHTML=`
    <div class="case-section"><h4>主诉</h4><p>${c.zs}</p></div>
    <div class="case-section"><h4>现病史</h4><p>${c.xbs}</p></div>
    <div class="case-section"><h4>既往史</h4><p>${c.jwzx}</p></div>
    <div class="case-section"><h4>查体</h4><p>${c.ct}</p></div>
    <div class="case-section"><h4>辅助检查</h4><p>${c.fz}</p></div>
    <div class="case-section"><h4>诊断</h4><p>${c.zd}</p></div>
    <div class="case-section"><h4>治疗</h4><p>${c.zl}</p></div>
    <div class="case-section"><h4>随访</h4><p>${c.sy}</p></div>`;
  document.getElementById('d-btns').innerHTML = `
    <button class="btn outline" onclick="window.open('${c.src}','_blank')">查看原文（搜狗微信）</button>`;
  document.getElementById('d-zh').style.display='none';
  document.getElementById('mask').classList.add('show');
  addHistory(c.t,c.src);
}

function openEnglishCase(i){
  currentText = strip(i.description||i.title);
  document.getElementById('d-title').textContent = i.title;
  document.getElementById('d-body').innerHTML = `
    <div class="case-section"><h4>来源</h4><p>BMJ Case Reports（英国医学杂志病例报告）</p></div>
    <div class="case-section"><h4>疾病种类</h4><p>详见标题诊断</p></div>
    <div class="case-section"><h4>病例摘要</h4><p>${esc(strip(i.description||''))}</p></div>`;
  document.getElementById('d-btns').innerHTML = `
    <button class="btn" onclick="doTranslate()" id="t-btn">翻译成中文</button>
    <button class="btn outline" onclick="window.open('${i.link}','_blank')">查看原文</button>`;
  document.getElementById('d-zh').style.display='none';
  document.getElementById('mask').classList.add('show');
  addHistory(i.title, i.link);
}
