name: Daily Refresh at 12:00
on:
  schedule:
    - cron: '0 4 * * *'  # UTC 4:00 = 北京时间 12:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch englio articles (daily)
        run: python3 scripts/fetch_articles.py
      - name: Fetch medical cases (daily)
        run: python3 scripts/fetch_medical.py
      - name: Fetch finance data (daily)
        run: python3 scripts/fetch_finance.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json medical.json finance.json
          git commit -m "chore: daily refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git push
